<DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Feature Digital Clock</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="nav-container">
      <nav class="tabs">
        <button class="tab-btn active" data-tab="clock-tab">Clock</button>
        <button class="tab-btn" data-tab="world-tab">World Clock</button>
        <button class="btn-tab" data-tab="stopwatch-tab">Stop Watch</button>
        <button class="btn-tab" data-tab="timer-tab">Timer</button>
        <button class="btn-tab" data-tab="alarm-tab">Alarm</button>
      </nav>
      <main class="tab-content">
        <section id="clock-tab" class="content-section active">
          <h2>Local Time</h2>
          <div id="local-clock" class="display-time">00:00:00</div>
          <div id="local-date" class="display-date">Loading Date</div>
        </section>
        <section id="world-tab" class="content-section">
          <h2>World Clock</h2>
          <div class="world-grid">
                    <div class="world-card">
                        <h3>New York (EST)</h3>
                        <div id="ny-time" class="world-time">00:00:00</div>
                    </div>
                    <div class="world-card">
                        <h3>London (GMT)</h3>
                        <div id="london-time" class="world-time">00:00:00</div>
                    </div>
                    <div class="world-card">
                        <h3>Tokyo (JST)</h3>
                        <div id="tokyo-time" class="world-time">00:00:00</div>
                    </div>
                </div>
        </section>
         <!-- 3. Stopwatch -->
            <section id="stopwatch-tab" class="content-section">
                <h2>Stopwatch</h2>
                <div id="stopwatch-display" class="display-time">00:00:00.00</div>
                <div class="controls">
                    <button id="sw-start">Start</button>
                    <button id="sw-stop" disabled>Stop</button>
                    <button id="sw-reset">Reset</button>
                </div>
            </section>

            <!-- 4. Timer (Countdown) -->
            <section id="timer-tab" class="content-section">
                <h2>Timer</h2>
                <div id="timer-display" class="display-time">00:00:00</div>
                <div class="timer-inputs">
                    <input type="number" id="timer-hours" min="0" max="23" placeholder="HH">
                    <input type="number" id="timer-minutes" min="0" max="59" placeholder="MM">
                    <input type="number" id="timer-seconds" min="0" max="59" placeholder="SS">
                </div>
                <div class="controls">
                    <button id="timer-start">Start</button>
                    <button id="timer-pause" disabled>Pause</button>
                    <button id="timer-reset">Reset</button>
                </div>
            </section>

            <!-- 5. Alarm -->
            <section id="alarm-tab" class="content-section">
                <h2>Alarm</h2>
                <div class="alarm-setup">
                    <input type="time" id="alarm-time">
                    <button id="alarm-set">Set Alarm</button>
                </div>
                <div id="alarm-status">No alarm set</div>
                <button id="alarm-stop" class="hidden">Stop Alarm Sound</button>
            </section>

        </main>
    </div>

    <!-- Hidden audio element for Alarm/Timer alert -->
    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-84.wav" loop></audio>

    <script src="app.js"></script>
</body>
</html>
    </div>
  </body>
</html>
